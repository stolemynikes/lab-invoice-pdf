# The invoice app + a tunnel on the Synology NAS.
# Container Manager → Project → Create → choose this folder. Step by step: docs/synology-nl.md
#
# Nothing is opened in the router: the app has no ports on the network.
# The only way in from the internet is through the tunnel, which only reaches this app.
#
# WHICH TUNNEL: set COMPOSE_PROFILES in .env (next to this file) to one of:
#   quick       test only: random https://….trycloudflare.com address, changes after every restart (no account)
#   ngrok       fixed address: free https://<name>.ngrok-free.app, or your own subdomain via a CNAME at your host
#               (needs NGROK_AUTHTOKEN and NGROK_DOMAIN in .env)
#   cloudflare  fixed address on a domain that is managed by Cloudflare (needs CLOUDFLARE_TUNNEL_TOKEN in .env)
# Leave it empty for no tunnel at all (the app still makes invoices; only the customer account buttons need a tunnel).
# Changing tunnel = change COMPOSE_PROFILES (+ its token) in .env and recreate the project. No code changes.

services:
  factuur-app:
    # The image GitHub builds after a push to the branch release (NAS Beheer -> Paneel -> Updates).
    # build: . is only used when you build here yourself (docker compose up -d --build).
    image: ghcr.io/stolemynikes/factuur-app:release
    build: .
    container_name: factuur-app
    restart: unless-stopped
    # The DSM user "factuurapp" (see the guide). It may only use the invoice folder and this project folder.
    user: "${PUID:-1026}:${PGID:-100}"
    env_file: .env
    environment:
      # Paths inside the container. The real folders on the NAS are set under "volumes".
      PORT: 8080
      INVOICE_PDF_DIR: /facturen
      DATABASE_PATH: /data/invoices.db
      # The Exact login changes every time it is used, so it must live on the volume (not inside the container)
      EXACT_TOKEN_PATH: /data/exact-token.json
      # Settings from the NAS admin panel and the logbook live next to the database
      SETTINGS_PATH: /data/settings.json
      TZ: Europe/Amsterdam
    volumes:
      # PDFs + JSON copies: the shared folder "facturen" (with snapshots and Hyper Backup)
      - /volume1/facturen:/facturen
      # The invoice-number database: on the NAS's own disk, inside this project folder
      - ./data:/data
    networks:
      - intern
      # Shared with the NAS admin panel (create it once: Container Manager -> Network -> Add -> nas-apps)
      - nas-apps

  # Test: quick tunnel, like Kasper. The address is in the log of this container.
  tunnel-quick:
    profiles: ["quick"]
    image: cloudflare/cloudflared:latest
    container_name: factuur-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://factuur-app:8080
    depends_on:
      - factuur-app
    networks:
      - intern

  # Fixed address through ngrok. NGROK_DOMAIN: the free <name>.ngrok-free.app from the ngrok dashboard,
  # or your own subdomain (e.g. facturen.example.nl) with a CNAME record at your host (paid ngrok plan).
  tunnel-ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    container_name: factuur-tunnel
    restart: unless-stopped
    command: http factuur-app:8080 --url ${NGROK_DOMAIN:-missing-NGROK_DOMAIN-in-env}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - factuur-app
    networks:
      - intern

  # Fixed address through a Cloudflare named tunnel (Zero Trust → Networks → Tunnels; public hostname → http://factuur-app:8080)
  tunnel-cloudflare:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: factuur-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - factuur-app
    networks:
      - intern

networks:
  intern:
  nas-apps:
    external: true
    name: nas-apps
