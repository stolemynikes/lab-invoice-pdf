api_version = "2026-07"

[[extensions]]
name = "Facturen"
handle = "invoices-page"
type = "ui_extension"

# An extra page in the customer account: a list of all invoices and credit notes
[[extensions.targeting]]
module = "./src/InvoicesPage.jsx"
target = "customer-account.page.render"

# Needed to ask the invoice app for the customer's own documents (see src/appUrl.js)
[extensions.capabilities]
network_access = true
